name: Bug Report
description: Report a bug in InstaReply Bot
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below so we can fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
      placeholder: e.g., "Replies are not being sent for messages from specific contacts"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open the app
        2. Create a rule with pattern...
        3. Send a test DM...
        4. See error in "Last attempt"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: ai-provider
    attributes:
      label: AI Provider
      description: Which AI provider are you using?
      options:
        - Groq (Free)
        - OpenCode Zen (Free)
        - Google Gemini
        - OpenRouter
        - NVIDIA NIM
        - OpenAI
        - Custom Endpoint
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App Version
      description: "What version of InstaReply Bot are you using?"
      placeholder: "e.g., v0.4"
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android Version
      description: "What Android version is your device running?"
      options:
        - "8.0 (Oreo)"
        - "9.0 (Pie)"
        - "10"
        - "11"
        - "12"
        - "13"
        - "14"
        - "15+"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Model
      description: "What device are you using?"
      placeholder: "e.g., Samsung Galaxy S24"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: "If applicable, add screenshots or error logs."
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I am using the latest version of InstaReply Bot
          required: false
