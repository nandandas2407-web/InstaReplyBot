name: Feature Request
description: Suggest a new feature for InstaReply Bot
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make InstaReply Bot better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: "What problem does this feature solve? Is it related to auto-reply, AI integration, or Instagram DM management?"
      placeholder: "e.g., I want to auto-reply to Instagram Story mentions too, not just DMs"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you tried any workarounds?
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - AI Provider Integration
        - Reply Rules & Filters
        - UI/UX Improvement
        - Instagram Integration
        - Performance
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
